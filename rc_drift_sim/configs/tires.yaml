# Tire compounds. MF5.2-style dimensionless Magic Formula coefficients at nominal load fz0.
# mu values are for dry asphalt (surfaces.yaml scales them). See docs/DESIGN.md section 4.
tires:
  hard_plastic_drift:       # low peak mu, very flat post-peak curve, operates at large slip
    fz0: 4.0
    pcx1: 1.3
    pdx1: 0.45
    pdx2: -0.05
    pex1: -0.5
    pex2: 0.0
    pkx1: 12.0
    pkx2: 0.0
    pkx3: 0.0
    pcy1: 1.25
    pdy1: 0.42
    pdy2: -0.05
    pey1: -0.5
    pey2: 0.0
    pky1: 8.0
    pky2: 1.5
    combined_mode: similarity
    rbx1: 10.0
    rbx2: 8.0
    rcx1: 1.0
    rby1: 8.0
    rby2: 6.0
    rby3: 0.0
    rcy1: 1.0
    relax_x: 0.03
    relax_y: 0.04
    loose_affinity: -0.3    # plastic on dirt is awful
    heat_capacity: 15.0
    cool_coeff: 0.15
    cool_speed_coeff: 0.05
    t_opt: 40.0
    t_width: 40.0
    temp_mu_drop: 0.08
    wear_mu_drop: 0.1
    wear_k_gain: 0.2
    wet_mu_drop: 0.3
    contamination_mu_drop: 0.4
    contamination_decay_dist: 2.0

  rubber_onroad:            # touring-car rubber: high grip, clear peak, moderate drop
    fz0: 4.0
    pcx1: 1.5
    pdx1: 1.1
    pdx2: -0.1
    pex1: -0.2
    pex2: 0.0
    pkx1: 25.0
    pkx2: 0.0
    pkx3: 0.0
    pcy1: 1.4
    pdy1: 1.0
    pdy2: -0.1
    pey1: -0.3
    pey2: 0.0
    pky1: 20.0
    pky2: 1.8
    combined_mode: similarity
    rbx1: 12.0
    rbx2: 10.0
    rcx1: 1.0
    rby1: 10.0
    rby2: 8.0
    rby3: 0.0
    rcy1: 1.0
    relax_x: 0.03
    relax_y: 0.04
    loose_affinity: 0.0
    heat_capacity: 20.0
    cool_coeff: 0.2
    cool_speed_coeff: 0.06
    t_opt: 50.0
    t_width: 25.0
    temp_mu_drop: 0.2
    wear_mu_drop: 0.2
    wear_k_gain: 0.3
    wet_mu_drop: 0.45
    contamination_mu_drop: 0.5
    contamination_decay_dist: 3.0

  foam:                     # foam tire: very high grip, sharp peak and drop, temperature sensitive
    fz0: 4.0
    pcx1: 1.6
    pdx1: 1.35
    pdx2: -0.12
    pex1: -0.3
    pex2: 0.0
    pkx1: 30.0
    pkx2: 0.0
    pkx3: 0.0
    pcy1: 1.5
    pdy1: 1.3
    pdy2: -0.12
    pey1: -0.4
    pey2: 0.0
    pky1: 25.0
    pky2: 1.8
    combined_mode: similarity
    rbx1: 12.0
    rbx2: 10.0
    rcx1: 1.0
    rby1: 10.0
    rby2: 8.0
    rby3: 0.0
    rcy1: 1.0
    relax_x: 0.025
    relax_y: 0.03
    loose_affinity: -0.4
    heat_capacity: 12.0
    cool_coeff: 0.15
    cool_speed_coeff: 0.05
    t_opt: 55.0
    t_width: 20.0
    temp_mu_drop: 0.3
    wear_mu_drop: 0.3
    wear_k_gain: 0.4
    wet_mu_drop: 0.6
    contamination_mu_drop: 0.6
    contamination_decay_dist: 4.0

  offroad_pin:              # pin/spike tire: soft lugs, worse on pavement, better on loose surfaces
    fz0: 4.0
    pcx1: 1.4
    pdx1: 0.8
    pdx2: -0.08
    pex1: -0.4
    pex2: 0.0
    pkx1: 15.0
    pkx2: 0.0
    pkx3: 0.0
    pcy1: 1.35
    pdy1: 0.75
    pdy2: -0.08
    pey1: -0.4
    pey2: 0.0
    pky1: 10.0
    pky2: 1.6
    combined_mode: similarity
    rbx1: 10.0
    rbx2: 8.0
    rcx1: 1.0
    rby1: 8.0
    rby2: 6.0
    rby3: 0.0
    rcy1: 1.0
    relax_x: 0.04
    relax_y: 0.05
    loose_affinity: 0.5
    heat_capacity: 18.0
    cool_coeff: 0.2
    cool_speed_coeff: 0.06
    t_opt: 45.0
    t_width: 30.0
    temp_mu_drop: 0.15
    wear_mu_drop: 0.25
    wear_k_gain: 0.3
    wet_mu_drop: 0.35
    contamination_mu_drop: 0.3
    contamination_decay_dist: 2.0
