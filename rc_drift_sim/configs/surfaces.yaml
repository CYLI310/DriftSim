# Surface types. mu_scale is relative to the tire's dry-asphalt mu.
# Paved surfaces keep the tire's own curve shape (shape_blend 0 -> sharp peak).
# Loose surfaces blend the shape factor C toward <= 1 (no sharp peak, grip keeps building),
# shift the peak to larger slip, soften stiffness and add plowing drag. See docs/DESIGN.md.
surfaces:
  dry_asphalt:
    mu_scale: 1.0
    stiffness_scale: 1.0
    peak_slip_shift: 0.0
    shape_c_target: 1.0
    shape_blend: 0.0
    curvature_e_shift: 0.0
    rolling_resistance: 0.015
    looseness: 0.0
    loose_drag: 0.0
    roughness: 0.02
    mu_patch_std: 0.03
    optical_texture: 0.9
    wet: 0
    color: "#4a4a4a"
  wet_asphalt:
    mu_scale: 0.7
    stiffness_scale: 0.9
    peak_slip_shift: 0.1
    shape_c_target: 1.0
    shape_blend: 0.0
    curvature_e_shift: 0.0
    rolling_resistance: 0.015
    looseness: 0.0
    loose_drag: 0.0
    roughness: 0.02
    mu_patch_std: 0.08
    optical_texture: 0.5
    wet: 1
    color: "#35404d"
