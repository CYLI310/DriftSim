[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc_drift_sim"
version = "0.1.0"
description = "Vectorized 2D vehicle dynamics simulator for a 1/10-scale RC drift car"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pyyaml",
  "matplotlib",
  "gymnasium",
  "jax",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes", "pygame"]

[project.scripts]
driftsim-datagen = "rc_drift_sim.datagen.__main__:main"
driftsim-gui = "rc_drift_sim.app.__main__:main"

[tool.setuptools.packages.find]
include = ["rc_drift_sim*"]

[tool.setuptools.package-data]
rc_drift_sim = ["configs/*.yaml", "app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "benchmark: performance benchmarks (informational)",
  "slow: slow tests",
]
